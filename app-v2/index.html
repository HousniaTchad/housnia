<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E8457A">
<title>Housnia</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--pink:#E8457A;--powder:#FAD4E0;--plum:#5B1E44;--sand:#FBF4E6;--coral:#F28C6B;--teal:#4FB5A5;--red:#C62828;--ink:#2B2B2B;--muted:#6B5A63;--line:#EFDCE4;--white:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",Arial,sans-serif;background:var(--sand);color:var(--ink);font-size:17px;line-height:1.45}
#app{max-width:540px;margin:0 auto;min-height:100vh;background:var(--sand)}
header{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--white);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header img{width:34px;height:34px;border-radius:9px}
header h1{font-size:19px;margin:0;color:var(--plum);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{border:0;background:var(--powder);color:var(--plum);border-radius:999px;padding:8px 12px;font-weight:700;font-size:15px}
main{padding:16px 16px 120px}
h2{color:var(--plum);font-size:22px;margin:4px 0 12px}
h3{color:var(--plum);font-size:18px;margin:0 0 6px}
h4{color:var(--plum);font-size:16px;margin:12px 0 4px}
p{margin:0 0 10px}
.card{background:var(--white);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(91,30,68,.08)}
.muted{color:var(--muted);font-size:15px}
.small{font-size:14px}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:14px 16px;font-size:17px;font-weight:700;color:#fff;background:var(--pink);margin:8px 0;text-align:center;text-decoration:none}
.btn svg{width:20px;height:20px;vertical-align:-4px;margin-inline-end:6px}
.btn.plum{background:var(--plum)}.btn.teal{background:var(--teal)}.btn.coral{background:var(--coral)}.btn.light{background:var(--powder);color:var(--plum)}.btn.red{background:var(--red)}.btn.ghost{background:#fff;color:var(--plum);border:2px solid var(--line)}
.big{font-size:34px;font-weight:800;color:var(--pink);line-height:1.1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{border:0;border-radius:18px;padding:16px 10px;color:#fff;font-size:16px;font-weight:700;text-align:center;min-height:100px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.tile svg{width:30px;height:30px}
.row{display:flex;gap:10px;align-items:center}
.list button.item{display:flex;width:100%;align-items:center;gap:10px;text-align:start;border:0;background:#fff;border-radius:14px;padding:14px;margin-bottom:8px;font-size:16px;font-weight:600;color:var(--ink);box-shadow:0 1px 2px rgba(91,30,68,.06)}
.list button.item span.t{flex:1}
.badge{display:inline-block;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:800;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 12px}
.chip{border:2px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;font-size:15px;color:var(--ink)}
.chip.on{background:var(--pink);border-color:var(--pink);color:#fff;font-weight:700}
.chip.dg{border-color:#E57373;color:#A61B1B}
.chip.dg.on{background:var(--red);border-color:var(--red);color:#fff}
.level{border-radius:16px;padding:14px;margin-bottom:14px;border:2px solid}
.level .lt{font-weight:800;font-size:18px;margin-bottom:4px}
.keep{background:var(--powder);border-radius:14px;padding:12px;color:var(--plum);margin:10px 0}
.alert{background:#FDECEC;border:2px solid var(--red);border-radius:14px;padding:12px;color:#7a1414;font-weight:600}
.seg{display:flex;background:#fff;border-radius:14px;padding:4px;margin-bottom:14px;border:1px solid var(--line)}
.seg button{flex:1;border:0;background:none;border-radius:10px;padding:10px 4px;font-size:15px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--pink);color:#fff}
input[type=date],input[type=number],input[type=tel],input[type=text],select,textarea{width:100%;font-size:17px;padding:11px;border-radius:12px;border:1px solid #D9C2CE;background:#fff;color:var(--ink);font-family:inherit}
label{display:block;font-weight:700;color:var(--plum);margin:8px 0 4px}
details{background:#fff;border-radius:14px;margin-bottom:10px;box-shadow:0 1px 2px rgba(91,30,68,.06)}
details summary{padding:14px;font-weight:700;color:var(--plum);cursor:pointer;list-style:none;display:flex;gap:8px;align-items:center}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"+";margin-inline-start:auto;font-size:22px;color:var(--pink)}
details[open] summary::after{content:"–"}
details .in{padding:0 14px 14px}
dl{margin:0}dt{font-weight:700;color:var(--plum);margin-top:8px;font-size:15px}dd{margin:2px 0 0}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;background:var(--white);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav .in{display:flex;max-width:540px;width:100%}
nav button{flex:1;border:0;background:none;padding:8px 2px 10px;font-size:11.5px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
nav button svg{width:24px;height:24px}
nav button.on{color:var(--pink);font-weight:700}
.sos{position:fixed;right:max(14px,calc(50% - 256px));bottom:82px;border:0;background:var(--red);color:#fff;border-radius:999px;padding:13px 17px;font-weight:800;font-size:16px;box-shadow:0 4px 14px rgba(198,40,40,.35);display:flex;align-items:center;gap:8px;z-index:7}
.sos svg{width:22px;height:22px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:10px}
.cal div{aspect-ratio:1;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:14px;background:#F6EEF2}
.cal .p{background:var(--pink);color:#fff;font-weight:700}.cal .f{background:#CDEDE7;color:#1d5e55;font-weight:700}.cal .o{background:var(--teal);color:#fff;font-weight:800}.cal .t{outline:3px solid var(--plum)}.cal .h{background:none;color:var(--muted);font-weight:700}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;margin-top:10px}.legend span{display:inline-flex;align-items:center;gap:5px}.legend i{width:13px;height:13px;border-radius:4px;display:inline-block}
.hist{border-inline-start:4px solid var(--line);padding:6px 10px;margin:8px 0;background:#fff;border-radius:8px}
table.m{width:100%;border-collapse:collapse;font-size:15px}table.m th,table.m td{padding:6px;border-bottom:1px solid var(--line);text-align:start}
.proto{font-size:13px;color:var(--muted);text-align:center;margin-top:18px}
.hide{display:none}
</style>
</head>
<body>
<div id="app">
  <header><button class="back hide" id="backBtn" aria-label="Retour">‹ Retour</button><img src="icon-192.png" alt=""><h1 id="title">Housnia</h1></header>
  <main id="view" aria-live="polite"></main>
</div>
<button class="sos hide" id="sos"></button>
<nav class="hide" id="nav"><div class="in" id="navIn"></div></nav>
<script src="content.js"></script>
<script>
"use strict";
/* ---------- Icônes ---------- */
const I={
home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>',
journal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>',
cal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
preg:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="4.5" r="2.5"/><path d="M10 8h3a5 5 0 0 1 0 10h-1l-1 4M10 8l-1 6 2 4"/></svg>',
baby:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="9" r="5"/><path d="M10 9h.01M14 9h.01M10.5 11.5c1 .7 2 .7 3 0M7 18c1.5 2 8.5 2 10 0"/></svg>',
drop:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3s6 7 6 11a6 6 0 0 1-12 0c0-4 6-11 6-11z"/></svg>',
book:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 5c3-1 6-1 9 1 3-2 6-2 9-1v14c-3-1-6-1-9 1-3-2-6-2-9-1z"/><path d="M12 6v14"/></svg>',
agenda:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4M8 14h3"/></svg>',
sos:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18h.01"/></svg>',
phone:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg>',
spk:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 9a4 4 0 0 1 0 6"/></svg>'
};

/* ---------- Stockage local (reste sur le téléphone) ---------- */
const S={get(k,d){try{const v=localStorage.getItem("hsn2_"+k);return v===null?d:JSON.parse(v)}catch(e){return d}},
set(k,v){try{localStorage.setItem("hsn2_"+k,JSON.stringify(v))}catch(e){}},
clear(){try{Object.keys(localStorage).filter(k=>k.startsWith("hsn2_")).forEach(k=>localStorage.removeItem(k))}catch(e){}}};

/* ---------- Utilitaires ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const DAY=864e5;
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const parse=s=>{if(!s)return null;const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const fmt=d=>d.toLocaleDateString("fr-FR",{day:"numeric",month:"long",year:"numeric"});
const fmtS=d=>d.toLocaleDateString("fr-FR",{day:"numeric",month:"short"});
const addD=(d,n)=>new Date(d.getTime()+n*DAY);
const diffD=(a,b)=>Math.round((a-b)/DAY);
const badge=lv=>`<span class="badge" style="background:${LEVELS[lv].bg};color:${LEVELS[lv].color};border:1px solid ${LEVELS[lv].color}">${LEVELS[lv].short}</span>`;

/* ---------- État ---------- */
let profile=S.get("profile",null), ok=S.get("ok",false);
let stack=[{v:"home"}];
const cur=()=>stack[stack.length-1];
function go(v,p){stack.push(Object.assign({v},p||{}));render()}
function tabTo(v){stack=[{v}];render()}
function back(){if(stack.length>1)stack.pop();render()}

/* ---------- Contexte médical ---------- */
const ctxOf=()=>profile==="preg"?"preg":profile==="post"?"post":"cycle";
function info(){
  const l=parse(S.get("lmp","")), b=parse(S.get("birth",""));
  return {weeks:l?Math.floor(diffD(today(),l)/7):null, babyDays:b?diffD(today(),b):null};
}
const allSyms=ctx=>SYMPTOMS[ctx].flatMap(c=>c.items);
function symById(ctx,id){return allSyms(ctx).find(s=>s.id===id)}
function lvOf(s,ctx){return typeof s.lv==="function"?s.lv(ctx,info()):s.lv}
function worst(levels){for(const l of ORDER)if(levels.includes(l))return l;return 0}

/* ---------- Voix (synthèse du téléphone ; audios enregistrés prévus) ---------- */
function speak(text,btn){
  if(!("speechSynthesis" in window)){alert("La lecture vocale n'est pas disponible sur ce téléphone.");return}
  const s=speechSynthesis; if(s.speaking){s.cancel();return}
  const u=new SpeechSynthesisUtterance(text);u.lang="fr-FR";u.rate=.92;
  const v=s.getVoices().find(v=>v.lang&&v.lang.toLowerCase().startsWith("fr"));if(v)u.voice=v;s.speak(u);
}
const listen=t=>`<button class="back" data-say="${esc(t)}" style="display:inline-flex;align-items:center;gap:6px;margin:4px 0 8px">${I.spk} Écouter</button>`;

/* ---------- Alertes ---------- */
function levelCard(lv,reasons,harm){
  const L=LEVELS[lv];
  let h=`<div class="level" style="background:${L.bg};border-color:${L.color}"><div class="lt" style="color:${L.color}">${lv===1?"⚠ ":""}${L.name}</div><p style="font-weight:600">${harm?HARM_MSG:L.msg}</p>`;
  if(reasons&&reasons.length)h+=`<ul style="margin:6px 0 0;padding-inline-start:20px">${reasons.map(r=>`<li>${r}</li>`).join("")}</ul>`;
  if(lv===1)h+=`${callButtons()}<button class="btn red" data-go="sos">Voir les gestes d'urgence</button>`;
  return h+`</div>`;
}
function callButtons(){
  const n=S.get("nums",{}); const list=[["centre","Centre de santé"],["trust","Personne de confiance"],["amb","Ambulance / secours"]].filter(([k])=>n[k]);
  if(!list.length)return `<button class="btn ghost" data-go="nums">${I.phone} Enregistrer mes numéros d'urgence</button>`;
  return list.map(([k,l])=>`<a class="btn red" href="tel:${esc(n[k].replace(/\s/g,""))}">Appeler : ${l} (${esc(n[k])})</a>`).join("");
}
function homeAlerts(){
  const out=[];
  if(ctxOf()==="cycle"){
    const l=parse(S.get("last","")),c=Number(S.get("cycle",28))||28;
    if(l){const late=diffD(today(),l)-c; if(late>7)out.push({lv:3,html:`Tes règles sont en retard d'environ ${late} jours. Fais un test de grossesse et parles-en à une sage-femme.`});}
  }
  const logs=S.get("logs",{}), d=iso(today()), y=iso(addD(today(),-1));
  for(const day of [d,y]){const e=logs[day];if(!e)continue;
    const items=[...(e.me||[]).map(id=>[e.ctx,id]),...(e.baby||[]).map(id=>["baby",id])].map(([c,id])=>{const s=symById(c,id);return s?{s,lv:lvOf(s,c),c}:null}).filter(Boolean);
    const w=worst(items.map(x=>x.lv)); if(w&&w!==0){out.push({lv:w,harm:items.some(x=>x.s.harm),html:`Journal du ${day===d?"jour":"jour d'hier"} : ${items.filter(x=>x.lv===w).map(x=>(x.c==="baby"?"bébé – ":"")+x.s.t).join(", ")}.`});}
  }
  return out.sort((a,b)=>ORDER.indexOf(a.lv)-ORDER.indexOf(b.lv));
}

/* ---------- Calendrier médical ---------- */
function events(){
  const ev=[], l=parse(S.get("lmp","")), b=parse(S.get("birth",""));
  if(ctxOf()==="preg"&&l){ANC_WEEKS.forEach(w=>ev.push({d:addD(l,w*7),t:`Consultation prénatale (vers ${w} semaines)`,auto:1}));ev.push({d:addD(l,20*7+3),t:"Échographie (avant 24 semaines)",auto:1});ev.push({d:addD(l,280),t:"Date prévue d'accouchement",auto:1});}
  if(ctxOf()==="post"&&b){PNC_DAYS.forEach(x=>ev.push({d:addD(b,x.d),t:x.t,auto:1}));VACC.forEach(x=>ev.push({d:addD(b,x.d),t:"Bébé : "+x.t,auto:1}));}
  S.get("appts",[]).forEach((a,i)=>ev.push({d:parse(a.date),t:a.type+(a.note?" – "+a.note:""),i}));
  return ev.filter(e=>e.d).sort((a,b)=>a.d-b.d);
}

/* ---------- Écrans ---------- */
const V={};
V.welcome=()=>({t:"Housnia",h:`<div class="card" style="text-align:center"><img src="icon-512.png" alt="" style="width:110px;border-radius:24px"><h2 style="margin-top:10px">Bienvenue sur Housnia</h2><p class="muted">Ta compagne de santé : règles, grossesse, après l'accouchement et santé de ton bébé. Fonctionne sans internet.</p></div>
<div class="card"><h3>Important</h3><p>Housnia t'aide à comprendre ton corps et à reconnaître les signes de danger. <b>Elle ne remplace pas une sage-femme ou un médecin.</b></p><p><b>En cas de doute, va toujours au centre de santé.</b></p><p class="muted small">Prototype : les contenus sont en cours de validation par un comité médical. Tes données restent sur ton téléphone.</p><button class="btn" data-act="accept">J'ai compris</button></div>`});
V.profile=()=>({t:"Ma situation",h:`<div class="card"><h3>Qui es-tu ?</h3><p class="muted">L'application s'adapte à ta situation. Tu peux la changer à tout moment.</p>
<button class="btn" data-prof="girl">Je suis une jeune fille</button><button class="btn coral" data-prof="period">J'ai mes règles</button><button class="btn plum" data-prof="preg">Je suis enceinte</button><button class="btn teal" data-prof="post">J'ai accouché récemment</button></div>`});
V.home=()=>{
  const ctx=ctxOf(), al=homeAlerts(), up=events().filter(e=>e.d>=today()).slice(0,2);
  let sum="";
  if(ctx==="preg"){const w=info().weeks; sum=w!==null&&w>=0&&w<=44?`<div class="card"><h3>Ma grossesse</h3><div class="big">Semaine ${w}</div><p class="muted">Mois ${Math.min(9,Math.floor(w/4.4)+1)} sur 9</p></div>`:`<div class="card"><p>Entre la date de tes dernières règles dans « Ma grossesse ».</p><button class="btn plum" data-go="preg">Ma grossesse</button></div>`;}
  else if(ctx==="post"){const d=info().babyDays; sum=d!==null&&d>=0?`<div class="card"><h3>Après bébé</h3><div class="big">Jour ${d}</div><p class="muted">après la naissance</p></div>`:`<div class="card"><p>Entre la date de naissance de ton bébé dans « Après bébé ».</p><button class="btn teal" data-go="post">Après bébé</button></div>`;}
  else{const np=nextPeriod(); sum=np?`<div class="card"><h3>Prochaines règles</h3><div class="big">${fmt(np.date)}</div><p class="muted">${np.label}</p></div>`:`<div class="card"><p>Entre la date de tes dernières règles pour voir ton cycle.</p><button class="btn" data-go="cycle">Mes règles</button></div>`;}
  const tiles={cycle:[["cycle","Mes règles",I.drop,"var(--pink)"],["journal","Journal du jour",I.journal,"var(--coral)"],["learn","Apprendre",I.book,"var(--plum)"],["agenda","Mes rendez-vous",I.agenda,"var(--teal)"]],
    preg:[["preg","Ma grossesse",I.preg,"var(--coral)"],["journal","Journal du jour",I.journal,"var(--pink)"],["learn","Apprendre",I.book,"var(--plum)"],["agenda","Mes rendez-vous",I.agenda,"var(--teal)"]],
    post:[["post","Après bébé",I.baby,"var(--teal)"],["journal","Journal du jour",I.journal,"var(--pink)"],["learn","Apprendre",I.book,"var(--plum)"],["agenda","Rendez-vous et vaccins",I.agenda,"var(--coral)"]]}[ctx];
  return {t:"Housnia",h:`${al.map(a=>levelCard(a.lv,[a.html],a.harm)).join("")}${sum}
  ${up.length?`<div class="card"><h3>Prochains rendez-vous</h3>${up.map(e=>`<p><b>${fmtS(e.d)}</b> · ${esc(e.t)} <span class="muted small">(${diffD(e.d,today())===0?"aujourd'hui":"dans "+diffD(e.d,today())+" j"})</span></p>`).join("")}</div>`:""}
  <div class="grid2">${tiles.map(([v,l,ic,c])=>`<button class="tile" style="background:${c}" data-go="${v}">${ic}${l}</button>`).join("")}</div>
  <div class="card" style="margin-top:14px"><button class="btn ghost" data-go="nums">${I.phone} Mes numéros d'urgence</button><button class="btn ghost" data-go="summary">Résumé pour la sage-femme</button><button class="btn light" data-act="chgprof">Changer ma situation</button><button class="btn light" data-act="reset">Effacer toutes mes données</button>
  <p class="proto">🔒 Tes données restent sur ton téléphone · Prototype v2 – contenus à valider par le comité médical</p></div>`};
};
function nextPeriod(){const l=parse(S.get("last","")),c=Number(S.get("cycle",28))||28;if(!l)return null;const n=addD(l,c),d=diffD(n,today());return {date:n,label:d===0?"aujourd'hui":d>0?`dans ${d} jour${d>1?"s":""}`:`en retard de ${-d} jour${-d>1?"s":""} – note le premier jour de tes nouvelles règles`}}

V.journal=()=>{
  const p=cur(), date=p.date||iso(today()), ctx=ctxOf(), logs=S.get("logs",{}), e=logs[date]||{ctx,me:[],baby:[],note:""};
  const who=p.who||(ctx==="post"?"me":"me");
  const sel=new Set(who==="baby"?e.baby:e.me), set=who==="baby"?SYMPTOMS.baby:SYMPTOMS[ctx];
  const segs=ctx==="post"?`<div class="seg"><button data-who="me" class="${who==="me"?"on":""}">Moi</button><button data-who="baby" class="${who==="baby"?"on":""}">Mon bébé</button></div>`:"";

V.history=()=>{

V.summary=()=>{

V.cycle=()=>{
  const last=S.get("last",""), cyc=Number(S.get("cycle",28))||28, l=parse(last); let cal="";
  if(l){const td=today(),st=new Date(td.getFullYear(),td.getMonth(),1),first=(st.getDay()+6)%7,days=new Date(td.getFullYear(),td.getMonth()+1,0).getDate(),ov=cyc-14;
    let cells=["L","M","M","J","V","S","D"].map(h=>`<div class="h">${h}</div>`).join("");for(let i=0;i<first;i++)cells+="<div class='h'></div>";
    for(let d=1;d<=days;d++){const dt=new Date(td.getFullYear(),td.getMonth(),d),diff=diffD(dt,l),pos=((diff%cyc)+cyc)%cyc;let c="";if(diff>=-cyc*2){if(pos<5)c="p";else if(pos===ov)c="o";else if(pos>=ov-5&&pos<=ov+1)c="f"}if(dt.getTime()===td.getTime())c+=" t";cells+=`<div class="${c}">${d}</div>`}
    const np=nextPeriod();
    cal=`<div class="card"><h3>Prochaines règles</h3><div class="big">${fmt(np.date)}</div><p class="muted">${np.label}</p><div class="cal">${cells}</div>
    <div class="legend"><span><i style="background:var(--pink)"></i>Règles</span><span><i style="background:#CDEDE7"></i>Période fertile</span><span><i style="background:var(--teal)"></i>Ovulation estimée</span><span><i style="outline:3px solid var(--plum)"></i>Aujourd'hui</span></div>
    <p class="muted small" style="margin-top:8px">Estimation seulement : ce n'est pas une méthode de contraception fiable.</p></div>`;}
  return {t:"Mes règles",h:`${cal}<div class="card"><label for="last">Premier jour de tes dernières règles</label><input type="date" id="last" value="${esc(last)}" max="${iso(today())}">
  <label for="cyc">Durée habituelle du cycle (jours)</label><select id="cyc">${Array.from({length:25},(_,i)=>20+i).map(n=>`<option ${n===cyc?"selected":""}>${n}</option>`).join("")}</select>

};

/* ---------- Rendu ---------- */
function render(){
  const ready=ok&&profile; let scr;
  if(!ok)scr=V.welcome(); else if(!profile)scr=V.profile(); else scr=(V[cur().v]||V.home)();
  $("#title").textContent=scr.t; $("#view").innerHTML=scr.h;
  $("#backBtn").classList.toggle("hide",!(ready&&stack.length>1));
  $("#nav").classList.toggle("hide",!ready); $("#sos").classList.toggle("hide",!ready);
  $("#sos").innerHTML=I.sos+" Urgence";
  if(ready){const ctx=ctxOf();const suivi=ctx==="preg"?["preg","Grossesse",I.preg]:ctx==="post"?["post","Après bébé",I.baby]:["cycle","Mes règles",I.drop];
    const tabs=[["home","Accueil",I.home],["journal","Journal",I.journal],suivi,["learn","Apprendre",I.book],["agenda","Agenda",I.agenda]];
    const root=stack[0].v;$("#navIn").innerHTML=tabs.map(([k,l,ic])=>`<button data-tab="${k}" class="${root===k?"on":""}">${ic}<span>${l}</span></button>`).join("");}
  window.scrollTo(0,0);
}
function evalJournal(date){
  const e=S.get("logs",{})[date]; if(!e)return;
  const it=[...(e.me||[]).map(id=>[e.ctx,id]),...(e.baby||[]).map(id=>["baby",id])].map(([c,id])=>{const s=symById(c,id);return s?{s,lv:lvOf(s,c),c}:null}).filter(Boolean);
  const w=worst(it.map(x=>x.lv));
  const reasons=it.filter(x=>x.lv===w&&w!==0).map(x=>`${x.c==="baby"?"Bébé : ":""}<b>${x.s.t}</b>${x.s.why?" – "+x.s.why:""}`);
  const infos=it.filter(x=>x.lv===0&&x.s.why).map(x=>`${x.s.t} : ${x.s.why}`);
  $("#jres").innerHTML=(it.length?levelCard(w,w?reasons:[],it.some(x=>x.s.harm)):"")+(infos.length?`<div class="card"><h3>Bon à savoir</h3><ul style="padding-inline-start:20px;margin:0">${infos.map(x=>`<li>${x}</li>`).join("")}</ul></div>`:"")+(it.length?`<p class="muted small">Enregistré. En cas de doute, va toujours au centre de santé.</p>`:"");
  $("#jres").scrollIntoView({behavior:"smooth"});
}
document.addEventListener("click",ev=>{
  const b=ev.target.closest("button,a"); if(!b||b.tagName==="A")return; const d=b.dataset;
  if(b.id==="backBtn"){back();return} if(b.id==="sos"){go("sos");return}
  if(d.say){speak(d.say,b);return}
  if(d.tab){stack=[{v:d.tab}];render();return}
  if(d.go){const p={};if(d.id)p.id=d.id;if(d.i!==undefined)p.i=+d.i;if(d.j!==undefined)p.j=+d.j;if(d.date)p.date=d.date;if(d.who)p.who=d.who;go(d.go,p);return}
  if(d.prof){profile=d.prof;S.set("profile",profile);stack=[{v:"home"}];render();return}
  if(d.who){cur().who=d.who;render();return}
  if(d.tab2){cur().tab=d.tab2;render();return}
  if(d.sym){b.classList.toggle("on");return}
  const a=d.act;
  if(a==="accept"){ok=true;S.set("ok",true);render()}
  else if(a==="chgprof"){profile=null;S.set("profile",null);stack=[{v:"home"}];render()}
  else if(a==="reset"){if(confirm("Effacer toutes tes données de ce téléphone ?")){S.clear();ok=false;profile=null;stack=[{v:"home"}];render()}}
  else if(a==="savecycle"){S.set("last",$("#last").value);S.set("cycle",+$("#cyc").value);render()}
  else if(a==="savepreg"){S.set("lmp",$("#lmp").value);render()}
  else if(a==="savebirth"){S.set("birth",$("#birth").value);render()}
  else if(a==="savenums"){S.set("nums",{centre:$("#nc").value.trim(),trust:$("#nt").value.trim(),amb:$("#na").value.trim()});back()}
  else if(a==="savemeas"){const m={date:iso(today()),w:$("#mw").value,h:$("#mh").value,hc:$("#mhc").value};if(m.w||m.h||m.hc){const l=S.get("meas",[]);l.push(m);S.set("meas",l);render()}}
  else if(a==="addappt"){const l=S.get("appts",[]);l.push({date:$("#ad").value,type:$("#at").value,note:$("#an").value.trim()});S.set("appts",l);render()}
  else if(a==="delappt"){const l=S.get("appts",[]);l.splice(+d.i,1);S.set("appts",l);render()}
  else if(a==="savelog"){
    const date=$("#jd").value||iso(today()), who=cur().who||"me", logs=S.get("logs",{}), e=logs[date]||{ctx:ctxOf(),me:[],baby:[],note:""};
    const ids=[...document.querySelectorAll(".chip.on")].map(x=>x.dataset.sym);
    if(who==="baby")e.baby=ids; else {e.me=ids;e.ctx=ctxOf();}
    e.note=$("#jn").value.trim(); if(!e.me.length&&!e.baby.length&&!e.note)delete logs[date]; else logs[date]=e;

  }
});
document.addEventListener("change",ev=>{if(ev.target.id==="jd"){cur().date=ev.target.value;render()}});
render();
if("serviceWorker" in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{});
